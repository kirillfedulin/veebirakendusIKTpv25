<!DOCTYPE html>
<html lang="ee">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtne tabel</h2>
<link rel="stylesheet" href="tabelstyle.css">
<table id="lihtnetabel">
  <tr>
    <td class="nimia">A</td>
    <td>B</td>
  </tr>
  <tr>
    <td>C</td>
    <td>D</td>
  </tr>
</table>
<h2>Tabel kus on ühendatud lahtrid</h2>
<table id="keeruline1">
  <tr>
    <td colspan="2" class="nimia">A</td>
  </tr>
  <tr>
    <td>C</td>
    <td>D</td>
  </tr>
</table>
<h2>Veel üks tabel kus on ühendatud lahtid</h2>
<table id="keeruline2">
  <tr>
    <td rowspan="2" class="nimia">A</td>
    <td>B</td>
  </tr>
  <tr>
    <td>C</td>
  </tr>
</table>
<h2>Iseseisav tabel</h2>
<table id="keeruline3">
  <tr>
    <td rowspan="4">A</td>
    <td colspan="4">B</td>

  </tr>
  <tr>
    <td class="small">C</td>
    <td>D</td>
    <td rowspan="3">E</td>
  </tr>
  <tr>
    <td>F</td>
  </tr>
  <tr>
    <td>G</td>
  </tr>
</table>


</body>
</html>
