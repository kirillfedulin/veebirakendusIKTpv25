<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
    <script src="../js/kysimustikScript.js"></script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab = komentaar -->
    <table border="1">
        <tr>
            <td>    <!-- Tekstkast -->
                <label for="nimi">Nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Kirill" oninput="nimiLugemineKastist()">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>    <!-- ripploend või rippmenüü -->
                <label for="stiil">Vali meeldivaim muusikastiil:</label>
            </td>
            <td>
                <select name="stiil" id="stiil" onchange="selectValik()">
                <option value="vali">vali...</option>
                <option value="hiphop">HipHop</option>
                <option value="jazz">Jazz</option>
                <option value="rock">Rock</option>
                <option value="metal">Metal</option>
                <option value="rap">Rap</option>
            </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
    </table>

    <table border="1">
        <tr>
            <td>
                <strong>
                Kuidas sa muusikat peamiselt kuulad?
                </strong>
            </td>
            <td>
                <input type="radio" name="platvorm" id="spotify" value="" onclick="radiovalik()">
                <label for="spotify">Spotify
                </label>
                <input type="radio" name="platvorm" id="applemusic" value="" onclick="radiovalik()">
                <label for="applemusic">Apple Music
                </label>
                <input type="radio" name="platvorm" id="soundcloud" value="" onclick="radiovalik()">
                <label for="soundcloud">SoundCloud
                </label>

                <!-- "radio nupud uks valik mitmes -->
                <td>
                    <div id="vastus2"></div>
                    <img src="" alt="" id="valitudPilt">
                </td>
            </td>
        </tr>
    </table>

    <table border="1">
        <tr>
            <td colspan="2">
                <!-- checkbox -->
                <fieldset>
                    <legend>Tee oma valikud - lemmik grupp</legend>
                    <input type="checkbox" name="lemmikud" id="limpbizkit" value="limpbizkit" onchange="checkboxValik()">
                    <label for="limpbizkit">Limp Bizkit</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="linkinpark" value="Linkin Park" onchange="checkboxValik()">
                    <label for="linkinpark">Linkin Park</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="korn" value="Korn" onchange="checkboxValik()">
                    <label for="korn">Korn</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="nirvana" value="Nirvana" onchange="checkboxValik()">
                    <label for="nirvana">Nirvana</label>
                    <br>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
    </table>

<table border="1">
    <tr>
        <td>
            <!-- range - vahemik -->
            <label for="tund">
                Mitu tundi päevast sa kuulad muusikat?
            </label>
        </td>
        <td>
            0<input type="range" id="tund" min="o" max="24" onchange="rangeValik()">24
        </td>
        <td>
            <div id="vastus4"></div>
        </td>
    </tr>
    <tr>
        <td>
            <label for="button">
                Click see nupp:
            </label>
        </td>
        <td>
            <input type="button" onclick="alert('Hello World!')" value="Click Me!" id="button">
        </td>
    </tr>
    <tr>
        <td>
            <label for="favcolor">
                Vali sinu lemmik värv:
            </label>
        </td>
        <td>
            <input type="color" id="favcolor" name="favcolor">
        </td>
    </tr>
    <tr>
        <td>
            <label for="birthday">
                Sissesta sinu sünnipäev:
            </label>
        </td>
    <td>
        <input type="date" id="birthday" name="birthday">
    </td>
</tr>
    <tr>
        <td>
            <label for="email">
                Sissesta sinu e-post:
            </label>
        </td>
        <td>
            <input type="email" id="email" name="email" placeholder="naiteks: nimi.eenimi@gmail.com">
        </td>
    </tr>
    <tr>
        <td>
            <label for="myfile">Select a file:</label>
        </td>
        <td>
            <input type="file" id="myfile" name="myfile">
        </td>
    </tr>
    <tr>        <!-- Mida arvad muusika kuulamisest koolis? – textarea. -->
        <td>
            <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
        </td>
        <td>
            <textarea name="arvamus" id="arvamus" cols="30" rows="2" oninput="arvamusLugemine()"></textarea>
        </td>
        <td>
            <div id="vastus6"></div>
        </td>
    </tr>
    <tr>
        <td>
            <legend>Kas sa kuulad raadiot?</legend>
        </td>
        <td>
            <input type="radio" name="raadio" id="jah" value="Jah" onclick="kuuladRaadio()">
            <label for="jah">Jah</label>
            <br>
            <input type="radio" name="raadio" id="ei" value="Ei" onclick="kuuladRaadio()">
            <label for="ei">Ei</label>
            <br>
        </td>
        <td>
            <div id="vastus7"></div>
        </td>
    </tr> <!-- href=# -->
    <tr>
        <td>
            <label for="raadiojaam">Milliseid raadiojaamu oskad nimetada?</label>
        </td>
        <td>
            <input type="text" name="raadiojaam" id="raadiojaam" placeholder="skyradio" oninput="raadioJaam()">
        </td>
        <td>
            <div id="vastus8"></div>
        </td>
    </tr>
    <tr>
        <td>
            <input type="reset" value="Puhasta" onclick="puhasta()">
        </td>
        <td>
            <input type="button" value="Näita/Loe andmed" onclick="naitaKoike()">
        </td>
        <td>
            <div id="vastusKoik"></div>
        </td>
    </tr>
</table>

</form>
</body>
</html>
