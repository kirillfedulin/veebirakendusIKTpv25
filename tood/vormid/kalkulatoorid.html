<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalkulaatorid</title>
    <link rel="stylesheet" href="kalkStyle.css">
    <script src="kalkScript1.js"></script>
</head>
<body>
<h1>Kalkulaatorid</h1>
<section id="yld">
  <!-- css paigutus flex row -->
  <section id="kalk1">
    <h2>Meetri/tolli kalkulaator</h2>
    <br>
    <label for="arv"> Sisesta arv</label>
    <input type="number" id="arv" min="1" max="100" value="1" onchange="teisendamine()">
    <br>
    <input type="radio" name="valik" id="meeter" value="meeter" onchange="teisendamine()">
    <label for="meeter">Meeter</label>
    <br>
    <input type="radio" name="valik" id="tolli" value="tolli" onchange="teisendamine()">
    <label for="tolli">Toll</label>
    <br>
    <div id="vastus"></div>
    <img src="" alt="" id="vastusepilt">
  </section>
  <section id="kalk2">
    <h2>Joogi kalkulaator</h2>
    <label for="kogus"> Mitu tk soovid:</label>
    <input type="number" id="kogus" min="1" max="10" value="1">
    <label for="joogiValik">Vali lemmik jooki:</label>
    <select name="joogiValik" id="joogiValik">
      <option value="1">CocaCola</option>
      <option value="2">RedBull</option>
      <option value="3">Lean</option>
      <option value="4">Jägermeister</option>
    </select>
    <div id="vastus2"></div>
  </section>
  <section id="kalk3"></section>
</section>

</body>
</html>
