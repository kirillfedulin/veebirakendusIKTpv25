<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Map area</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<h1>Map area kasutamine</h1>

<img src="arvutipilt.jpg"
     alt="Arvutipilt"
     usemap="#arvuti">

<map name="arvuti">

    <area shape="circle"
          coords="409,202,50"
          href="https://www.pexels.com/search/flowers/"
          alt="lilled">

    <!-- circle coords=(x,y,R) -->

    <area shape="rect"
          coords="580,113,715,249"
          href="monitor.html"
          alt="monitor">

    <!-- rect coords="x,y,x1,y2" -->

    <!-- kolmnurk - poly -->
    <area shape="poly"
          coords="192,487,333,446,294,516"
          href="probel.html"
          alt="probelil">

    <!-- peab võtma kõik koordinaadid vasakult paremale -->

</map>

<div>See on kasutaja monitor, kus sa saad näidata monitori!</div>

</body>
</html>
