<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Canvas joonistamine</title>
    <link rel="stylesheet" href="canvasstyle.css">
    <script src="canvasscript.js"></script>
</head>
<body>
<h1>Joonistusrakendus Canvas + js</h1>
    <canvas id="canvas" width="400" height="400"></canvas>
    <table>

        <tr>
            <td>
                <input type="button" value="Puhasta" id="puhasta" onclick="puhasta()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Ring" id="ring" onclick="ring()">
                <label for="raadius">Raadius:</label>
                <input type="number" id="raadius" min="1" max="50" step="2" onchange="ring()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Pilt" id="pilt" onclick="pilt()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Ristkulk" id="ristkulk" onclick="ristkylik()">
                <label for="laius">Laius:</label>
                <input type="number" id="laius" min="1" max="50" step="2" onchange="ristkylik()">
                <label for="kyrgus">Kõrgus:</label>
                <input type="number" id="kyrgus" min="1" max="50" step="2" onchange="ristkylik()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Kolmnurk" id="kolmnurk" onclick="kolmnurk()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Joon" id="joon" onclick="joon()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Ratas1" id="ratas1" onclick="ratas1()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Ratas2" id="ratas2" onclick="ratas2()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Kere" id="kere" onclick="kere()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="Tuled" id="tuled" onclick="tuled()">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" value="OMA" id="oma" onclick="oma()">
            </td>
        </tr>
    </table>
</body>
</html>
